[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turin-micromobility-analysis"
version = "0.1.0"
description = "Reproducible analysis of shared e-scooter trips in Turin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "branca>=0.7",
    "folium>=0.15",
    "geopandas>=0.14",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "shapely>=2.0",
]

[project.scripts]
turin-micromobility = "micromobility_analysis.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
